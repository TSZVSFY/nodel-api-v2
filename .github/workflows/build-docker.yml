name: Build Docker Image

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (amd64 for most NAS, arm64 for ARM NAS)'
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - both

jobs:
  # ============================================
  # Build and export Docker image as .tar file
  # ============================================
  build-and-export:
    name: Build Docker Image (.tar)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      # Skip arm64 unless explicitly requested
      - name: Skip check
        id: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHOICE="${{ inputs.platform }}"
            if [ "$CHOICE" = "both" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            elif [ "$CHOICE" = "${{ matrix.platform }}" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            # On push, only build amd64
            if [ "${{ matrix.platform }}" = "linux/amd64" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout code
        if: steps.skip.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.skip.outputs.should_run == 'true' && matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.skip.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract platform suffix
        if: steps.skip.outputs.should_run == 'true'
        id: suffix
        run: |
          if [ "${{ matrix.platform }}" = "linux/arm64" ]; then
            echo "name=arm64" >> $GITHUB_OUTPUT
          else
            echo "name=amd64" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        if: steps.skip.outputs.should_run == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          tags: novel-api:latest
          outputs: type=docker,dest=/tmp/novel-api-${{ steps.suffix.outputs.name }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image info
        if: steps.skip.outputs.should_run == 'true'
        run: |
          ls -lh /tmp/novel-api-*.tar
          docker load -i /tmp/novel-api-${{ steps.suffix.outputs.name }}.tar
          docker images novel-api

      - name: Upload Docker image artifact
        if: steps.skip.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: novel-api-docker-${{ steps.suffix.outputs.name }}
          path: /tmp/novel-api-${{ steps.suffix.outputs.name }}.tar
          retention-days: 30

  # ============================================
  # Also push to GitHub Container Registry
  # (optional - lets NAS pull directly without tar)
  # ============================================
  push-to-registry:
    name: Push to GitHub Container Registry
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract repo name
        id: repo
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPO}" >> $GITHUB_OUTPUT

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.repo.outputs.name }}/novel-api:latest
            ${{ steps.repo.outputs.name }}/novel-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
