# ============================================
# Nginx 反向代理配置 - Novel API
# ============================================
# 在群晖 NAS 的反向代理门户中配置，或手动添加到 Nginx 配置中

# 上游后端服务地址（Docker 容器映射的端口）
upstream novel_api_backend {
    server 127.0.0.1:35550;
    # 如果后端跑在 Docker 中，且 Nginx 也在 NAS 上，用上面的地址即可
    # 多实例可在这里加多行做负载均衡
}

server {
    listen 80;
    server_name novel-api.your-domain.com;  # 改成你的域名

    # HTTP 自动跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name novel-api.your-domain.com;  # 改成你的域名

    # --- SSL 证书（群晖控制面板 > 安全性 > 证书） ---
    # 如果用群晖自带证书管理，这两行可以注释掉
    # ssl_certificate     /usr/syno/etc/certificate/_archive/your_cert.crt;
    # ssl_certificate_key /usr/syno/etc/certificate/_archive/your_cert.key;

    # --- SSL 安全配置 ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- 上传文件大小限制 ---
    client_max_body_size 20m;

    # --- 反向代理核心配置 ---
    location / {
        proxy_pass http://novel_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # --- 静态文件缓存（如果后端开放了静态文件） ---
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        proxy_pass http://novel_api_backend;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
